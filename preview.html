<!doctype html>
<!-- Standalone visual preview of the ChromeSidebar component — dev tooling, not a test.
     Loads assets/sidebar.{css,js} directly and mounts one instance with a representative DTO
     (loose tabs, a plain group, two headed groups — one expanded, one collapsed — and a
     project-tree section with folders + leaf projects, across the dot states). Lets you iterate on the CSS/JS and SEE the result without building curator or
     warden.

     Fast loop (from a chrome-core checkout):
       just dev                → serve it with live reload (open preview.html at the printed URL)
       just shot [density]     → headless screenshot to preview.png
     Or reach it from either app: `just chrome-preview` (in warden / curator / lector).

     URL params (compose freely, e.g. ?density=compact&header=title):
       ?density=compact   preview the compact sizing scale (default: comfortable)
       ?header=title      the header without a URL field: downloads + nav on the title row
       ?header=bare       the header with nothing but the name (warden's shape). The default mounts
                          every part: nav, the URL toolbar and downloads. The readout shows the
                          title row's measured px: one row in all three at 300px.
       ?width=<px>        the sidebar's width (default 300); narrow it to see the title row wrap.
       ?dl=active|unseen|failed   paint the downloads button in that state
       ?open=1            mount the pinned "Open" section (warden's `open_tabs_section`): mirror
                          rows above the main list for every `live` or `detached` tab, which in
                          this fixture pulls rows out of all three section kinds (loose, a plain
                          group, and a project tree) while leaving every one of them in place.
       ?background=1         mount the pinned "Background" section (warden's
                          `background_tabs_section`): unloaded `on` / `ghost` tabs, collapsed until its
                          arrow is clicked (remembered in localStorage).
                          The main list below renders de-emphasised while the section is showing —
                          hover anywhere in it (the empty space under the last row counts) to
                          bring it back.
       ?incoming=1        mount the pinned "Incoming" section (`incoming` in the DTO): a document
                          item with four actions and a rejected link with a problem line and a
                          disabled action. Clicking an action logs `onIncomingAction`.
       ?q=<text>          type <text> into the search field, rendering the filtered list.
       ?hole=1            lay the sidebar out beside a content hole (a grid stands in for the page)
                          and mount with `hole`: the titlebar's toggle collapses it; hover the left
                          edge to peek. Add &collapsed=1 to start collapsed, &peek=1 to start peeking,
                          &rail=edge|map for the other rail looks, &count=1 for the toggle's tab count.
                          The shot needs a wider window: `--window-size=1100,700`.

     Raw headless invocation (what `just shot` wraps):
       chrome --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
         --window-size=310,900 --default-background-color=00000000 \
         --screenshot=preview.png "file://$PWD/preview.html"
     (`chrome` = Google Chrome / Chromium — any Chromium-based browser with --screenshot.) -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="assets/sidebar.css" />
    <style>
      /* `font-family` must match what the consuming apps set (warden and curator both use
         system-ui) — sidebar.css deliberately sets none, inheriting the host page's. Without it
         the preview renders in the browser's default serif, so every glyph falls back through a
         DIFFERENT face and the preview silently misrepresents the app: text metrics, and above
         all the confirm-row glyphs (☠/⏻/↩︎), whose optical corrections are calibrated against
         the faces system-ui resolves. Dropping it makes this a measuring tool that lies. */
      html, body { margin: 0; background: #0c0f12; font-family: system-ui, sans-serif; }
      #sidebar { width: 300px; }
      /* Corner readout: mode + measured title-row height, so the loop doubles as a measuring tool.
         Bottom corner, clear of the header it measures. */
      #readout {
        position: fixed; bottom: 8px; right: 8px; z-index: 9;
        font: 12px ui-monospace, monospace; color: #cdd; background: #1b1f24cc;
        border: 1px solid #333; border-radius: 6px; padding: 4px 8px; white-space: pre;
      }
      /* ?hole=1: the page shell every consumer uses — a row of the sidebar and the content hole. */
      #app.with-hole { display: flex; height: 100vh; }
      #app.with-hole #sidebar { flex: none; }
      #hole { display: none; }
      #app.with-hole #hole {
        display: block; flex: 1; min-width: 0;
        background: repeating-linear-gradient(90deg, transparent 0 119px, #ccd 119px 120px),
                    repeating-linear-gradient(0deg, transparent 0 27px, #ccd 27px 28px) #f7f7f7;
      }
    </style>
  </head>
  <body>
    <div id="readout"></div>
    <div id="app"><aside id="sidebar"></aside><div id="hole"></div></div>
    <script src="assets/sidebar.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const density = params.get("density") || "comfortable";
      const headerMode = params.get("header") || "full";
      if (params.get("width")) document.getElementById("sidebar").style.width = `${params.get("width")}px`;
      const headerCfg = headerMode === "bare" ? {} : {
        nav: ["back", "forward", "reload", "home"],
        urlField: headerMode === "title" ? null : { placeholder: "Open a folder or page" },
        downloads: true,
      };
      // ?open=1 → the pinned "Open" section (warden's `open_tabs_section`); off by default, as it is
      // for every app that does not opt in.
      const withHole = params.get("hole") === "1";
      if (withHole) document.getElementById("app").classList.add("with-hole");
      const holeCfg = withHole ? { hole: document.getElementById("hole") } : {};
      const openSection = params.get("open") === "1";
      const backgroundSection = params.get("background") === "1";
      const incoming = params.get("incoming") !== "1" ? undefined : [
        {
          id: "in-1", title: "Quarterly budget review", icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231a9e5f'/%3E%3C/svg%3E",
          actions: [
            { id: "add", label: "Add" }, { id: "add-active", label: "Add to active" },
            { id: "open", label: "Open" }, { id: "dismiss", label: "Dismiss" },
          ],
        },
        {
          id: "in-2", title: "https://example.com/a/very/long/link/that/is/not/a/document", problem: "Not a document",
          actions: [
            { id: "add", label: "Add" },
            { id: "add-active", label: "Add to active", disabled: "No active group" },
          ],
        },
      ];
      const T = (id, title, group, tree, treePath, extra = {}) => ({
        id, title, group, tree, treePath,
        live: false, attention: null, presence: null, killable: false, startable: false, warn: false,
        ...extra,
      });
      const dto = {
        title: "personal",
        colour: "#1a9e8f",
        density,
        windowDrag: false,
        openSection,
        backgroundSection,
        incoming,
        rail: params.get("rail") || undefined,
        toggleCount: params.get("count") === "1",
        // Headed groups whose members are hidden — app-owned; onToggleGroup below answers with a
        // fresh update, as a real app does.
        collapsed: ["/f/ops"],
        tabs: [
          // Loose tabs (no group) — the flat, un-sectioned rows.
          T("/p/dotfiles", "dotfiles", null, false, [], { live: true, presence: "on" }),
          T("/p/blog", "blog", null, false, [], { live: true, presence: "off", accent: "#e0a030" }),
          T("/p/notes", "notes", null, false, [], { presence: "off" }),
          T("/p/agent", "agent (crashed)", null, false, [], { presence: "ghost", startable: true }),
          T("/p/scratch", "scratch (popped out)", null, false, [], { presence: "off", detached: true }),
          // A plain [[window.group]] section (tree:false) — flat rows under a labelled header.
          T("/g/api", "api", "backend", false, [], { killable: true, suspendable: true, presence: "on", live: true }),
          // Only one ending action configured → the armed row shows ☠ disabled beside a live ⏻.
          T("/g/jobs", "jobs (suspend only)", "backend", false, [], { suspendable: true, presence: "on", live: true }),
          T("/g/workers", "workers", "backend", false, [], { presence: "off" }),
          // Headed groups (flotilla's shape): `group` is the head tab's id, `groupName` its title,
          // and the `head` row stands in for the text header, with a disclosure arrow.
          T("/f/site", "site", "/f/site", false, [], { head: true, groupName: "site", live: true }),
          T("/f/site-api", "site api", "/f/site", false, [], { groupName: "site", live: true }),
          T("/f/site-docs", "site docs", "/f/site", false, [], { groupName: "site" }),
          T("/f/ops", "ops", "/f/ops", false, [], { head: true, groupName: "ops" }),
          T("/f/ops-grafana", "grafana", "/f/ops", false, [], { groupName: "ops" }),
          T("/f/ops-alerts", "alerts", "/f/ops", false, [], { groupName: "ops" }),
          // A project-tree ([[window.root]]) section — tree:true rows nest by treePath.
          T("/d/github.com/acme/webapp", "webapp", "Developer", true, ["github.com", "acme"], { presence: "on" }),
          T("/d/github.com/acme/design-system", "design-system", "Developer", true, ["github.com", "acme"], { presence: "on" }),
          T("/d/github.com/example/x", "x", "Developer", true, ["github.com", "example"]),
          T("/d/github.com/lockyc/agentmux", "agentmux", "Developer", true, ["github.com", "lockyc"], { presence: "off" }),
          T("/d/github.com/lockyc/chrome-core", "chrome-core", "Developer", true, ["github.com", "lockyc"], { presence: "off" }),
          T("/d/github.com/lockyc/curator", "curator", "Developer", true, ["github.com", "lockyc"], { live: true, presence: "on" }),
          T("/d/github.com/lockyc/warden", "warden", "Developer", true, ["github.com", "lockyc"], { live: true, presence: "on" }),
          T("/d/github.com/spatie/y", "y", "Developer", true, ["github.com", "spatie"]),
        ],
      };
      const sb = window.ChromeSidebar.mount(
        document.getElementById("sidebar"),
        {
          // Logged so a click on the detached ("scratch (popped out)") row can be confirmed still
          // firing onSelect — the app maps that to "raise the popped-out window".
          onSelect(id) { console.log("onSelect", id); },
          onUnload() {},
          onSuspend(id) { console.log("onSuspend", id); },
          onDestroy(id) { console.log("onDestroy", id); },
          onStart() {},
          onRescan() {},
          onResize() {},
          // Opt-in pop-out affordance (capability-by-callback-presence) — logged so the click can be
          // confirmed firing from the preview. To verify the glyph is ABSENT when unsupplied, comment
          // this out and reload: every row's ⤢ disappears.
          onPopOut(id) { console.log("onPopOut", id); },
          onRemove(id) { console.log("onRemove", id); },
          onToggleGroup(group, collapsed) {
            dto.collapsed = collapsed ? [...dto.collapsed, group] : dto.collapsed.filter((g) => g !== group);
            sb.update(dto);
          },
          onIncomingAction(item, action, at) { console.log("onIncomingAction", item, action, at); },
          onContextMenu(id, at) { console.log("onContextMenu", id, at); },
          onNav(action) { console.log("onNav", action); },
          onUrlSubmit(value) { console.log("onUrlSubmit", value); return Promise.resolve(); },
          onDownloads(rect) { console.log("onDownloads", rect); },
        },
        { storageKey: "preview", appName: "preview", ...headerCfg, ...holeCfg }
      );
      sb.update(dto);
      if (withHole) {
        sb.setSidebarCollapsed(params.get("collapsed") === "1" || params.get("peek") === "1");
        if (params.get("peek") === "1") sb._setPeek(true);
      }
      sb.setNavEnabled(true);
      const dl = params.get("dl");
      if (dl) sb.setDownloads({ active: dl === "active", unseen: dl !== "active", unseenFailed: dl === "failed" });
      // `?q=` types into the search field, to see a filtered list.
      if (params.get("q")) {
        sb.searchInput.value = params.get("q");
        sb.searchInput.dispatchEvent(new Event("input"));
      }
      // Readout: mode + measured title-row height.
      const rh = document.querySelector("#cc-banner .cc-title-row").offsetHeight;
      document.getElementById("readout").textContent =
        `density: ${density}\nheader:  ${headerMode}\nopen:    ${openSection ? "on" : "off"}\ntitle row: ${rh}px`;
    </script>
  </body>
</html>
